name: Phase 5.5B.1 Market Surface Validation

on:
  pull_request:
    paths:
      - 'assets/js/market.js'
      - 'assets/css/main.css'
      - 'assets/js/localization-dynamic.js'
      - 'market.html'
      - 'tests/test_phase5_5b1_market_surface.py'
      - '.github/workflows/phase55b1-market-surface-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check assets/js/market.js
          node --check assets/js/localization-dynamic.js
      - name: Market surface contract
        run: python tests/test_phase5_5b1_market_surface.py
      - name: Market regressions
        run: |
          python tests/test_phase4_3c_market_registry.py
          python tests/test_phase4_3e_search_crosslinks.py
          python tests/test_phase4_8_9_integration.py
          python tests/test_phase4_9_1_ui_polish.py
          python tests/test_market_5_1_ui_polish.py
          python tests/test_phase5_1_research_compare.py
          python tests/test_phase5_5a_listing_market.py
          python tests/test_phase5_5b_listing_coverage.py
          python tests/test_phase4_4f_production_hardening.py
