name: Listing Market Assisted Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview candidate changes or append approved snapshots
        required: true
        default: preview
        type: choice
        options:
          - preview
          - promote

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate and classify candidate snapshots
        run: python scripts/listing_snapshot_pipeline.py --mode ${{ inputs.mode }}
      - name: Job summary
        run: |
          echo "## Listing Market Assisted Refresh" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("data/candidate/market/listing-refresh-report.json").read_text())
          print(f"- Mode: **{r['mode']}**")
          print(f"- Existing: **{r['existing_records']}**")
          print(f"- Candidate: **{r['candidate_records']}**")
          for k,v in r.get('counts',{}).items():
              print(f"- {k}: **{v}**")
          if 'added' in r:
              print(f"- Added: **{r['added']}**")
              print(f"- Final: **{r['final_records']}**")
          PY
      - name: Commit appended production snapshots
        if: inputs.mode == 'promote'
        run: |
          if git diff --quiet -- data/mock/market/listing-observations.json; then
            echo "No new snapshot to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mock/market/listing-observations.json
          git commit -m "data(market): append approved listing snapshot"
          git push
