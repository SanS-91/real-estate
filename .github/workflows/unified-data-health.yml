name: Unified Data Health

on:
  # GitHub Actions commits made with GITHUB_TOKEN do not generally launch
  # downstream push-triggered Actions. React to completed source workflows
  # directly, so Maintenance reflects successful and failed collections.
  workflow_run:
    workflows:
      - Macro Candidate Collector
      - Legal Candidate Collector
      - Infrastructure Candidate Collector
    types:
      - completed
  schedule:
    - cron: '5 1 * * *'       # 08:05 ICT preflight
    - cron: '10 4 * * *'      # 11:10 ICT after morning FX/gold checks
    - cron: '45 10 * * 1-5'   # 17:45 ICT after afternoon FX/gold checks
  push:
    branches:
      - main
    paths:
      - 'config/operations_health.json'
      - 'config/update_matrix.json'
      - 'scripts/build_data_health.py'
      - 'data/mock/**'
      - 'data/processed/**'
      - 'data/candidate/**'
      - '.github/workflows/unified-data-health.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: unified-data-health-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build unified health snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_data_health.py --output data/state/data-health.json
      - name: Summary
        run: |
          echo "## Unified Data Health" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("data/state/data-health.json").read_text())
          print(f"- Overall: **{r['overall_status']}**")
          print("")
          print("| Module | Status | Datasets | Backlog | Last success |")
          print("|---|---|---:|---:|---|")
          for x in r.get("modules",[]):
              print(f"| {x['module']} | {x['status']} | {x['dataset_count']} | {x['candidate_backlog']} | {x.get('last_successful_run_at') or '—'} |")
          PY
      - name: Commit health snapshot
        run: |
          if git diff --quiet -- data/state/data-health.json; then
            echo "No health snapshot change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/data-health.json
          git commit -m "ops: refresh unified data health"
          # Other source collectors may have appended reviewed Market data while
          # this health snapshot was running. Rebase the single health commit.
          git restore --worktree -- .
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to publish health after concurrent updates."
          exit 1
