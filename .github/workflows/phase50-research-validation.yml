name: Phase 5.0 Cross-Module Research Validation

on:
  pull_request:
    paths:
      - 'research.html'
      - 'assets/js/research.js'
      - 'assets/js/common.js'
      - 'assets/js/localization-dynamic.js'
      - 'assets/css/main.css'
      - 'index.html'
      - 'market.html'
      - 'legal.html'
      - 'infrastructure.html'
      - 'macro.html'
      - 'maintenance.html'
      - 'tests/test_phase5_0_cross_module_research.py'
      - '.github/workflows/phase50-research-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: JavaScript syntax
        run: |
          node --check assets/js/research.js
          node --check assets/js/common.js
          node --check assets/js/localization-dynamic.js
      - name: Phase 5.0 research contract
        run: python tests/test_phase5_0_cross_module_research.py
      - name: Existing cross-link and production regressions
        run: |
          python tests/test_phase4_3e_search_crosslinks.py
          python tests/test_phase4_4f_production_hardening.py
