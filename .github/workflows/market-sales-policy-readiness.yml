name: Market 8B - FS Sales Policy Evidence Readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/mock/market/sales-policy-evidence.json'
      - 'data/mock/market/commercial-offer-leads.json'
      - 'scripts/build_market_commercial_leads.py'
      - 'tests/test_market_commercial_leads.py'
      - 'tests/test_market_commercial_leads_ui.cjs'
      - 'data/mock/core/sources.json'
      - 'scripts/build_market_sales_policy_readiness.py'
      - 'tests/test_market_sales_policy_readiness.py'
      - 'tests/test_market_sales_policy_ui.cjs'
      - 'assets/js/market.js'
      - 'assets/js/data-store.js'
      - 'assets/css/market-listing-evidence.css'
      - 'market.html'
      - '.github/workflows/market-sales-policy-readiness.yml'
  schedule:
    # 10:55 ICT every day. Do not turn source check into new commercial terms.
    - cron: '55 3 * * *'

permissions:
  contents: write

concurrency:
  group: market-sales-policy-readiness
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source attribution, PV gate and responsive UI contract
        run: |
          python tests/test_market_sales_policy_readiness.py
          python tests/test_market_commercial_leads.py
          node tests/test_market_sales_policy_ui.cjs
          node tests/test_market_commercial_leads_ui.cjs
          node --check assets/js/market.js
          node --check assets/js/data-store.js
      - name: Browser smoke - finance policy context across screen sizes
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python -m http.server 8770 --bind 127.0.0.1 > /tmp/market-sales-policy.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 3
          for width in 1440,900 390,844; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$width" --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:8770/market.html?view=benchmark' > "/tmp/market-policy-$width.html"
          done
          python - <<'PY'
          from pathlib import Path
          for viewport in ('1440,900','390,844'):
              doc=Path('/tmp/market-policy-'+viewport+'.html').read_text(encoding='utf-8')
              for text in ('Chính sách bán hàng','Nguồn thứ cấp','60%','35%','Chưa đủ điều kiện','TB153','Giá chào theo zone'):
                  assert text in doc,(viewport,text)
              assert 'Unable to load Market registry data' not in doc
          print('PASS policy claims visible, blocked PV, desktop/mobile.')
          PY
      - name: Publish source-readiness without automatic terms or prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tests/test_market_sales_policy_readiness.py
            python tests/test_market_commercial_leads.py
            python scripts/build_market_sales_policy_readiness.py
            python scripts/build_market_commercial_leads.py
            git add data/processed/market/sales-policy-readiness.json data/processed/market/commercial-offer-review.json
            if git diff --cached --quiet -- data/processed/market/sales-policy-readiness.json data/processed/market/commercial-offer-review.json; then
              echo "No new verified policy facts to publish."
              exit 0
            fi
            git commit -m "ops(market): publish source-gated sales policy readiness"
            if git push origin HEAD:main; then
              echo "Published policy readiness; net price/PV withheld pending contracts."
              exit 0
            fi
            echo "Concurrent change; rebuild readiness from new main."
            sleep $((attempt * 2))
          done
          exit 1
