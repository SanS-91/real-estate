name: Data Freshness Check

on:
  schedule:
    # GitHub cron is UTC. 00:45 UTC = 07:45 ICT every day.
    - cron: '45 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build current update-status snapshot
        run: |
          python scripts/build_update_status.py \
            --output data/state/update-status-runtime.json

      - name: Validate snapshot JSON
        run: python -m json.tool data/state/update-status-runtime.json > /dev/null

      - name: Write maintenance summary
        run: |
          python scripts/write_update_status_summary.py \
            --input data/state/update-status-runtime.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Phase 4.5 operational safety QA
        run: |
          python scripts/phase45_operational_qa.py \
            --output data/state/phase45-operational-qa.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload freshness snapshot
        uses: actions/upload-artifact@v7
        with:
          name: data-freshness-${{ github.run_number }}
          retention-days: 14
          path: |
            data/state/update-status-runtime.json
            data/state/phase45-operational-qa.json
          if-no-files-found: error
