name: Market News Responsive UI Validation

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/home-editorial.js'
      - 'assets/js/market-news-ui.js'
      - 'assets/css/market-news.css'
      - 'market.html'
      - 'legal.html'
      - 'infrastructure.html'
      - 'macro.html'
      - 'tests/test_market_news_ui.cjs'
      - '.github/workflows/market-news-responsive-ui.yml'
  pull_request:
    paths:
      - 'assets/js/market-news-ui.js'
      - 'assets/js/home-editorial.js'
      - 'assets/js/market.js'
      - 'legal.html'
      - 'infrastructure.html'
      - 'macro.html'
      - 'assets/css/market-news.css'
      - 'market.html'
      - 'tests/test_market_news_ui.cjs'
      - '.github/workflows/market-news-responsive-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax and UI contracts
        run: |
          node --check assets/js/market.js
          node --check assets/js/home-editorial.js
          node --check assets/js/market-news-ui.js
          node tests/test_market_news_ui.cjs
      - name: Render desktop and mobile screenshots
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No Chromium-compatible browser is installed on the runner"
            exit 1
          fi
          mkdir -p artifacts
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/market-news-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 3
          for module in market legal infrastructure macro; do
            for viewport in 1440,960 390,860; do
              label="${module}-${viewport}"
              "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --window-size="$viewport" --virtual-time-budget=10000 --dump-dom "http://127.0.0.1:8765/${module}.html?view=news" > "artifacts/${label}.html"
            done
          done
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=1440,960 --virtual-time-budget=10000 --screenshot=artifacts/market-news-desktop.png "http://127.0.0.1:8765/market.html?view=news"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=390,860 --virtual-time-budget=10000 --screenshot=artifacts/market-news-mobile.png "http://127.0.0.1:8765/market.html?view=news"
          python3 - <<'PY'
          from pathlib import Path
          for module in ('market','legal','infrastructure','macro'):
              for size in ('1440,960','390,860'):
                  html=Path(f'artifacts/{module}-{size}.html').read_text(encoding='utf-8')
                  assert 'market-news-filters' in html,(module,size,'news not rendered')
                  assert 'market-news-editorial-note' in html,(module,size,'shared editorial filter missing')
                  assert 'market-news-result' in html,(module,size,'news result count missing')
                  for needle in ('3 mẹo nâng cấp nội thất','bị xe ben cán tử vong','giảm gần 1.400 nhân sự'):
                      assert needle not in html,(module,size,needle)
          print('PASS: four topic-screened news tabs rendered at desktop and mobile widths')
          PY
      - name: Upload visual QA
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: market-news-responsive-qa
          path: artifacts/
          retention-days: 14
          if-no-files-found: warn
