name: Phase 4K Macro Recovery Verification

on:
  pull_request:
    paths:
      - '.github/workflows/phase4k-macro-recovery.yml'
      - 'tests/test_phase4_5b_customer_rates_auto_update.py'
      - 'tests/test_phase4_5d_operational_qa.py'
      - 'tests/test_macro_cloudflare_fallback.cjs'
      - 'tests/test_macro_maintenance_sync.py'
      - '.github/workflows/macro-candidate.yml'
      - 'workers/news-rss-fallback/**'
      - 'data/processed/macro/historical-observations.json'
      - 'data/processed/macro/historical-fx-gold-observations.json'
      - 'tests/test_macro_historical_fx_gold.cjs'
      - 'data/processed/macro/historical-monetary-observations.json'
      - 'data/mock/macro/indicators.json'
      - 'tests/test_macro_official_monetary_history.py'
      - 'tests/test_macro_monetary_history_ui.cjs'
      - 'scripts/collectors/nso_banking_activity.py'
      - 'scripts/persist_monthly_macro.py'
      - 'scripts/build_data_health.py'
      - 'config/monthly_auto_persistence_policy.json'
      - 'config/monthly_macro_production_gate.json'
      - 'config/production_promotion_policy.json'
      - 'config/source_pools.json'
      - 'config/live_sources.json'
      - 'config/frontend_indicator_map.json'
      - 'config/operations_health.json'
      - 'config/update_matrix.json'
      - 'tests/test_macro_m2_auto_update.py'
      - 'tests/test_macro_m2_health.py'
      - 'tests/test_phase4_5a_monthly_macro_auto_update.py'
      - 'tests/test_phase4_2i1_banking_activity.py'
      - 'assets/js/macro.js'
      - 'assets/js/data-store.js'
      - 'macro.html'
      - 'tests/test_macro_official_history.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase4k-macro-recovery.yml'
      - 'tests/test_phase4_5d_operational_qa.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-test-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pipeline requirements
        run: pip install -r requirements.txt
      - name: Validate restored customer-rate negative fixture
        run: |
          python tests/test_phase4_5b_customer_rates_auto_update.py
          python tests/test_phase4_4f_production_hardening.py
          python tests/test_phase4_4e_daily_macro_auto_publish.py
          python tests/test_phase4_5d_operational_qa.py
          node tests/test_macro_cloudflare_fallback.cjs
          python tests/test_macro_maintenance_sync.py
          python tests/test_macro_official_history.py
          node tests/test_macro_historical_fx_gold.cjs
          python tests/test_macro_official_monetary_history.py
          node tests/test_macro_monetary_history_ui.cjs
          python tests/test_phase4_2i1_banking_activity.py
          python tests/test_phase4_5a_monthly_macro_auto_update.py
          python tests/test_macro_m2_auto_update.py
          python tests/test_macro_m2_health.py
          node --check assets/js/macro.js
          node --check assets/js/data-store.js

  verify-real-daily-pipeline:
    if: github.event_name != 'pull_request'
    needs: verify-test-gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger existing controlled Macro daily markets workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A workflow_dispatch is a permitted trigger from GITHUB_TOKEN.
          # This runs the EXACT existing verified daily FX/gold path.
          # No source values, production JSON or corroboration gates are modified.
          gh workflow run macro-candidate.yml --ref main -f source=daily-markets-production
          echo "Dispatched Macro Candidate Collector using daily-markets-production."
          echo "Review resulting full workflow: https://github.com/$GH_REPO/actions/workflows/macro-candidate.yml"
