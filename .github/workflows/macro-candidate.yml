name: Macro Candidate Collector

on:
  schedule:
    # GitHub cron is UTC. 00:15 UTC = 07:15 ICT every day.
    - cron: '15 0 * * *'
    # 09:15 UTC = 16:15 ICT on business days.
    - cron: '15 9 * * 1-5'
  workflow_dispatch:
    inputs:
      source:
        description: 'Run one source only, or all'
        required: true
        default: all
        type: choice
        options:
          - all
          - nso-cpi
          - nso-banking-activity
          - sbv-central-rate
          - sbv-customer-rates
          - sjc-gold
          - vov-central-rate
          - vietcap-macro
          - vietnamplus-cpi
          - vietnamplus-central-rate
          - pnj-gold
          - doji-gold
          - baonghean-gold
          - banking-times-central-rate
          - vietnamnet-gold

permissions:
  contents: read

concurrency:
  group: macro-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore prior candidate/state cache
        uses: actions/cache@v4
        with:
          path: |
            data/candidate/macro
            data/state
          key: macro-candidate-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            macro-candidate-${{ github.ref_name }}-

      - name: Parser and discovery tests
        run: python tests/test_parsers.py

      - name: Candidate pipeline fixture E2E
        run: python tests/test_candidate_pipeline.py

      - name: Fallback, corroboration and normalization policy tests
        run: |
          python tests/test_fallback_pools.py
          python tests/test_phase4_2h1_safety.py
          python tests/test_phase4_2h2_safety.py
          python tests/test_phase4_2h2_frontend_contract.py
          python tests/test_phase4_2h3_latest_period.py
          python tests/test_phase4_2h4_vietnamplus_latest.py
          python tests/test_phase4_2i1_banking_activity.py
          python tests/test_phase4_2i2_nso_discovery.py
          python tests/test_phase4_2i3_banking_policy.py
          python tests/test_phase4_2j1_customer_rates.py

      - name: Promotion preview fixture tests
        run: python tests/test_promotion_preview.py

      - name: Controlled production promotion fixture tests
        run: python tests/test_production_promotion.py

      - name: Run live candidate collectors
        shell: bash
        run: |
          SOURCE='${{ github.event.inputs.source }}'
          if [ -n "$SOURCE" ] && [ "$SOURCE" != "all" ]; then
            python scripts/candidate_pipeline.py --mode candidate --source "$SOURCE"
          else
            python scripts/candidate_pipeline.py --mode candidate
          fi

      - name: Validate candidate output
        run: python scripts/validate.py --candidate-dir data/candidate/macro

      - name: Build dry-run promotion preview
        run: python scripts/promotion_preview.py --candidate-dir data/candidate/macro --output-dir data/staging/macro-preview

      - name: Validate promotion preview
        run: python scripts/validate_promotion_preview.py --preview-dir data/staging/macro-preview

      - name: Controlled production promotion
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == '' }}
        run: python scripts/promote_production.py --preview-dir data/staging/macro-preview --processed-dir data/processed/macro

      - name: Validate controlled production output
        if: ${{ github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == '' }}
        run: python scripts/validate_production.py --processed-dir data/processed/macro

      - name: Write workflow summary
        if: always()
        run: python scripts/write_ci_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Write promotion preview summary
        if: always()
        run: python scripts/write_promotion_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Write controlled production summary
        if: always()
        run: python scripts/write_production_summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-candidate-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/candidate/macro/
            data/rejected/macro/
            data/state/source-state.json
          # Raw fetched HTML is intentionally excluded.
      - name: Upload promotion preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-promotion-preview-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/staging/macro-preview/
            data/candidate/macro/publish-readiness.json
            data/candidate/macro/run-report.json
          # Staging preview artifact only; processed production is uploaded separately for review.
      - name: Upload controlled production artifact
        if: ${{ always() && (github.event_name == 'schedule' || github.event.inputs.source == 'all' || github.event.inputs.source == '') }}
        uses: actions/upload-artifact@v4
        with:
          name: macro-production-${{ github.run_number }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/processed/macro/
          # Controlled production remains reviewable as an artifact only. Repository persistence is a separate manual workflow.

