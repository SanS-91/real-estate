name: Market 4H - Verified Quarterly Residential Source

on:
  pull_request:
    paths:
      - 'scripts/market_quarterly_source_period.py'
      - 'scripts/market_cushman_auto_release.py'
      - 'tests/test_market_cushman_auto_release.py'
      - '.github/workflows/market-cushman-quarterly-auto.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/market_cushman_auto_release.py'
      - 'scripts/market_quarterly_source_period.py'
      - '.github/workflows/market-cushman-quarterly-auto.yml'
  schedule:
    - cron: '15 1 * * *'
    - cron: '15 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-verified-cushman-quarterly
  cancel-in-progress: false

jobs:
  quarterly-source-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        run: pip install -r requirements.txt
      - name: Validate primary-market scope, period and independent source checks
        run: |
          python -m py_compile scripts/market_quarterly_source_period.py scripts/market_cushman_auto_release.py
          python -m unittest discover -s tests -p 'test_market_quarterly_source_period.py' -v
          python -m unittest discover -s tests -p 'test_market_cushman_auto_release.py' -v
      - name: Collect new source-authored quarterly evidence and conditionally publish
        if: github.event_name != 'pull_request'
        run: python scripts/market_cushman_auto_release.py
      - name: Report source access, verification and release
        if: always() && github.event_name != 'pull_request'
        run: |
          echo '## Market 4H — Cushman verified quarterly residential' >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('data/candidate/market/market-cushman-quarterly-release-report.json')
          if not p.exists():
              print('No source report produced.')
          else:
              d=json.loads(p.read_text())
              print(f"- Source access: **{d['access']}**")
              print(f"- Decision: **{d['status']}**")
              print(f"- Independently hosted source checks retained: **{d['check_count']}**")
              print(f"- New verified quarter published: **{d['production_written']}**")
              print('Source publication date, apartment ASP and exact supply are never inferred.')
          PY
      - name: Atomically persist source evidence and verified production quarter
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state/market-cushman-quarterly-verification.json data/mock/market/observations.json
          if git diff --cached --quiet; then
            echo 'No source state changes.'
            exit 0
          fi
          git commit -m 'data(market): record independently confirmed quarterly residential metrics'
          git restore --worktree -- .
          pushed=false
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Concurrent repository update, safe rebase retry $attempt"
            sleep 3
          done
          if [ "$pushed" != true ]; then
            echo '::error::Could not persist verified source evidence and any release.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: market-cushman-independent-verification
          path: |
            data/state/market-cushman-quarterly-verification.json
            data/candidate/market/market-cushman-quarterly-release-report.json
          if-no-files-found: warn
          retention-days: 45
