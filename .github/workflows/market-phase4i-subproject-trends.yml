name: Market 4I - Verified Subproject History Chart

on:
  pull_request:
    paths:
      - 'assets/js/market-subproject-trends.js'
      - 'assets/js/market.js'
      - 'market.html'
      - 'tests/test_phase4i_subproject_history.cjs'
      - '.github/workflows/market-phase4i-subproject-trends.yml'
  push:
    branches: [main]
    paths:
      - 'assets/js/market-subproject-trends.js'
      - 'assets/js/market.js'
      - 'market.html'
      - '.github/workflows/market-phase4i-subproject-trends.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-specific-price-series:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax and source-specific publication gates
        run: |
          node --check assets/js/market-subproject-trends.js
          node --check assets/js/market.js
          node tests/test_phase4i_subproject_history.cjs
          node tests/test_market_project_price_range_chart.js
          node tests/test_market_history_series.cjs
      - name: Browser smoke deployed pricing with only published baseline periods
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || command-browser || true)"
          test -n "$BROWSER"
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/market4i-price.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 3
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom 'http://127.0.0.1:8765/market.html?view=pricing' >/tmp/market4i-price.html
          python - <<'PY'
          from pathlib import Path
          html=Path('/tmp/market4i-price.html').read_text()
          assert 'Giá tham khảo bổ sung' in html
          assert 'market-price-references' in html
          # Derive visibility from live published history: the October release
          # may appear autonomously between PR creation and CI execution.
          import json
          data=json.loads(Path('data/mock/market/alternative-subproject-monthly-history.json').read_text())['data']
          from collections import defaultdict
          periods=defaultdict(set)
          for row in data:
              if row.get('review_status') in ('source-indexed-baseline','reviewed-release','automated-source-verified'):
                  periods[(row.get('project_id'),row.get('series_key'))].add(row['period'])
          show=any(len(v)>=2 for v in periods.values())
          assert ('data-subproject-trend-toggle' in html)==show, 'Trend visibility must follow actual published periods'
          print('PASS: source-specific chart visibility follows verified history, never fixed baseline count.')
          PY
