name: Market News Multi-Source RSS

on:
  pull_request:
    paths:
      - 'scripts/market_news_rss.py'
      - 'scripts/test_market_news_rss.py'
      - 'scripts/news_schedule_gate.py'
      - 'tests/test_news_schedule_gate.py'
      - 'config/market-news-feeds.json'
      - '.github/workflows/market-news-rss.yml'
      - 'config/news-automation.json'
      - 'assets/js/news-automation-health.js'
      - 'assets/js/maintenance.js'
      - 'tests/test_news_automation_health.cjs'
      - 'tests/test_news_automation_schedule.py'
      - 'data/mock/core/sources.json'
  push:
    branches: [main]
    paths:
      - 'scripts/market_news_rss.py'
      - 'scripts/test_market_news_rss.py'
      - 'scripts/news_schedule_gate.py'
      - 'tests/test_news_schedule_gate.py'
      - 'config/market-news-feeds.json'
      - '.github/workflows/market-news-rss.yml'
      - 'config/news-automation.json'
      - 'assets/js/news-automation-health.js'
      - 'assets/js/maintenance.js'
      - 'tests/test_news_automation_health.cjs'
      - 'tests/test_news_automation_schedule.py'
  workflow_dispatch:
  schedule:
    # Eight primary daytime checks in Vietnam.
    - cron: '20 0,2,4,6,8,10,12,14 * * *'
    # Recovery attempt 30 minutes later, skips when already collected.
    - cron: '50 0,2,4,6,8,10,12,14 * * *'

permissions:
  contents: write

concurrency:
  group: market-news-publish
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
      - name: Gate duplicate recovery checks
        id: gate
        env:
          NEWS_EVENT: ${{ github.event_name }}
          NEWS_CRON: ${{ github.event.schedule }}
        run: python scripts/news_schedule_gate.py
      - uses: actions/setup-python@v7
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Unit tests and daily schedule contract
        if: steps.gate.outputs.run == 'true'
        run: |
          python scripts/test_market_news_rss.py
          python tests/test_news_automation_schedule.py
          python tests/test_news_schedule_gate.py
          node --check assets/js/news-automation-health.js
          node --check assets/js/maintenance.js
          node tests/test_news_automation_health.cjs
      - name: Preview live source feeds
        if: steps.gate.outputs.run == 'true'
        run: python scripts/market_news_rss.py --mode preview
      - name: Simulate append-only publishing on PR runner
        if: steps.gate.outputs.run == 'true' && github.event_name == 'pull_request'
        run: |
          python scripts/market_news_rss.py --mode promote
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('data/mock/articles/articles.json').read_text())
          assert data['record_count']==len(data['data'])
          keys=[x['url'] for x in data['data'] if x['id'].startswith('article-market-rss-')]
          assert len(keys)==len(set(keys))
          print('PR-only validation passed; remote production unchanged.')
          PY
      - name: Publish newly validated market news
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python scripts/market_news_rss.py --mode promote
      - name: Commit newly discovered articles
        if: steps.gate.outputs.run == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/mock/articles/articles.json data/state/news-ingestion-health.json; then
            echo "No new market news."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mock/articles/articles.json data/state/news-ingestion-health.json
          git commit -m "data(market): append new verified multi-source publisher RSS articles"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload publisher feed report
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: market-news-rss-report
          path: data/candidate/market/market-news-rss-report.json
          if-no-files-found: warn
          retention-days: 14
