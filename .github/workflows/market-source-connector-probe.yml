name: Market Source Connector Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/market_peer_price_watch.py'
      - 'data/mock/market/listing-scope-evidence.json'
      - 'tests/test_market_peer_price_watch.py'
      - '.github/workflows/market-source-connector-probe.yml'
  schedule:
    - cron: '15 2 * * 2,5'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Probe configured market sources
        run: python scripts/market_source_connector.py
      - name: Summary
        run: |
          echo "## Market Source Connector Probe" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path("data/candidate/market/market-source-connector-report.json").read_text())
          print(f"- Targets checked: **{r['targets_checked']}**")
          for k,v in r.get("counts",{}).items():
              print(f"- {k}: **{v}**")
          print("")
          print("| Target | Source | Status | HTTP |")
          print("|---|---|---|---:|")
          for x in r.get("sources",[]):
              print(f"| {x['target_id']} | {x['source_id']} | {x['status']} | {x.get('http_status','—')} |")
          print("")
          print("Discovery/probe only: production observations are not written.")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: market-source-connector-report
          path: data/candidate/market/market-source-connector-report.json
          retention-days: 14

  publish-price-health:
    needs: probe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate access-only monitoring logic
        run: python tests/test_market_peer_price_watch.py
      - name: Publish access/age report without touching source prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/market_peer_price_watch.py
            if git diff --quiet -- data/state/market-peer-price-watch.json; then
              echo "No monitoring change."
              exit 0
            fi
            git add data/state/market-peer-price-watch.json
            git commit -m "ops(market): refresh peer price evidence monitoring"
            if git push origin HEAD:main; then
              echo "Published source-access report; no price data mutated."
              exit 0
            fi
            echo "Concurrent repository writer: regenerate on latest main."
            sleep $((attempt * 2))
          done
          exit 1
