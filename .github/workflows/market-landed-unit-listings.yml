name: Market Landed Unit Asking Verification
on:
  workflow_dispatch:
  schedule:
    # 10:35 and 16:35 Asia/Ho_Chi_Minh
    - cron: '35 3,9 * * *'
  push:
    branches: [main]
    paths:
      - 'config/market-landed-unit-listing-targets.json'
      - 'scripts/market_landed_unit_listings.py'
      - 'tests/test_market_landed_unit_listings.py'
      - '.github/workflows/market-landed-unit-listings.yml'
permissions:
  contents: write
concurrency:
  group: market-landed-unit-offer-verification
  cancel-in-progress: false
jobs:
  verify-landed-offers:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install requests beautifulsoup4 lxml
      - name: Test absolute publisher dates, project identity, product and price arithmetic
        run: |
          python -m py_compile scripts/market_landed_unit_listings.py
          python -m unittest discover -s tests -p 'test_market_landed_unit_listings.py' -v
      - name: Independently inspect source listings, fail closed
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/market_landed_unit_listings.py
            python - <<'PY'
          import json
          from pathlib import Path
          output=json.loads(Path('data/mock/market/verified-landed-unit-listings.json').read_text())
          report=json.loads(Path('data/state/market-landed-unit-source-health.json').read_text())
          assert output['record_count']==len(output['data'])
          assert report['no_market_asp_or_transactions'] is True
          assert report['price_published_only_after_two_dated_checks'] is True
          assert report['sources_checked']>=2
          for x in output['data']:
              assert x['asset_type']=='landed'
              assert x['metric_type']=='single-unit-asking-price-per-land-sqm'
              assert x['review_status']=='automated-two-hosted-dated-checks'
              assert len(set(x['verification_run_ids']))==2
              assert x['source_updated_date'] and x['listed_land_area_sqm']>0
              assert x['listing_price_vnd']>0 and x['value_vnd_per_land_m2']>0
              assert x['subproject_id'] is None or isinstance(x['subproject_id'],str)
              assert 'average_asp' not in x and 'sales_units' not in x
          print('Validated NhaTot unit prices only after two source-dated checks')
          PY
            git add data/state/market-landed-unit-verification.json data/mock/market/verified-landed-unit-listings.json data/state/market-landed-unit-source-health.json
            if git diff --cached --quiet; then
              echo 'No source/evidence update'
              exit 0
            fi
            git commit -m 'data(market): refresh source-dated landed unit offer proofs'
            if git push origin HEAD:main; then
              echo 'Published source status and proof, no inferred project ASP'
              exit 0
            fi
            echo 'Retrying with newest source evidence'
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-landed-unit-offers-proof
          path: |
            data/state/market-landed-unit-verification.json
            data/mock/market/verified-landed-unit-listings.json
            data/state/market-landed-unit-source-health.json
          if-no-files-found: warn
          retention-days: 21
