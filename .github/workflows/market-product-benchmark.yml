name: Market 8B - Source-Verified Product Benchmark

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Market 4I.4 - Rever Verified Apartment Listing Discovery
      - Market 4I.6 - Muaban Unexpired Apartment Listing Verification
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'data/mock/market/individual-product-evidence.json'
      - 'data/mock/market/verified-unit-listings.json'
      - 'data/mock/market/verified-muaban-unit-listings.json'
      - 'data/state/market-rever-source-health.json'
      - 'data/state/market-muaban-source-health.json'
      - 'data/mock/market/projects.json'
      - 'data/mock/core/sources.json'
      - 'scripts/build_product_comparables.py'
      - 'tests/test_phase8b_product_benchmark.py'
      - 'assets/js/market.js'
      - 'assets/js/data-store.js'
      - 'assets/css/market-listing-evidence.css'
      - 'market.html'
      - 'tests/test_phase8b_product_benchmark_ui.cjs'
      - '.github/workflows/market-product-benchmark.yml'
  schedule:
    # Every day 10:30 ICT. Rebuild remains unchanged unless source facts change.
    - cron: '30 3 * * *'

permissions:
  contents: write

concurrency:
  group: market-product-benchmark-writer
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate denominator, dates, provenance and payment restrictions
        run: |
          python tests/test_phase8b_product_benchmark.py
          node --check assets/js/market.js
          node --check assets/js/data-store.js
          if test -f data/processed/market/product-comparables.json; then
            node tests/test_phase8b_product_benchmark_ui.cjs
          fi
      - name: Browser smoke - benchmark tab at desktop and mobile widths
        run: |
          set -eu
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          python -m http.server 8767 --bind 127.0.0.1 > /tmp/market-product-benchmark.log 2>&1 &
          PID=$!
          trap 'kill "$PID" || true' EXIT
          sleep 3
          for width in 1440,900 390,844; do
            "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size="$width" --virtual-time-budget=9000 --dump-dom 'http://127.0.0.1:8767/market.html?view=benchmark' > "/tmp/benchmark-$width.html"
          done
          python - <<'PY'
          from pathlib import Path
          for wh in ("1440,900","390,844"):
              page=Path("/tmp/benchmark-"+wh+".html").read_text(encoding="utf-8")
              assert "Benchmark theo sản phẩm" in page,wh
              assert "Giá rao theo từng căn" in page,wh
              assert "River Park 2" in page,wh
              assert "Stella Mega City" in page,wh
              assert "Chưa xác minh" in page,wh
              assert "Unable to load Market registry data" not in page,wh
          print("PASS product benchmark browser render on desktop and 390px mobile.")
          PY
      - name: Rebuild comparables from the latest main without rebase conflicts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python tests/test_phase8b_product_benchmark.py
            python scripts/build_product_comparables.py
            git add data/processed/market/product-comparables.json
            if git diff --cached --quiet -- data/processed/market/product-comparables.json; then
              echo "No new source product evidence: production remains unchanged."
              exit 0
            fi
            git commit -m "data(market): publish source-dated individual product comparables"
            if git push origin HEAD:main; then
              echo "Published verified normalized historical product dataset; no live offers implied."
              exit 0
            fi
            echo "Concurrent update; recomputing product benchmark from main."
            sleep $((attempt * 2))
          done
          exit 1
